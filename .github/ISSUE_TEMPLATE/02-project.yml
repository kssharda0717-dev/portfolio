name: Add or update a project
description: A new entry in the Work accordion, or a change to one that is already there.
title: 'content: project'
labels: ['content', 'content:project']
body:
  - type: markdown
    attributes:
      value: >-
        **Updating a project that already exists?** Put its **id** in the first
        box, fill in *only* the fields you want to change, and leave every other
        box empty. Blank means "leave as it is" — nothing you skip is lost.


        **Adding a new one?** Use an id nothing else uses and fill in everything
        down to the tech stack. The check will tell you if you have missed
        something, and nothing is committed until it passes.


        Only the id is marked required, because an update needs nothing else.

  - type: input
    id: id
    attributes:
      label: Short id
      description: >-
        Lowercase, hyphenated, no spaces. This is the permanent handle — skills
        cross-link to it, so changing it on an existing project breaks those links.
      placeholder: new-thing
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Title
      description: Shown on the accordion spine. Required for a new project.
      placeholder: New Thing — What It Does

  - type: input
    id: eyebrow
    attributes:
      label: Eyebrow
      description: >-
        The small line above the title. Two or three words, separated by a
        middle dot. Required for a new project.
      placeholder: Agentic AI · RAG

  - type: textarea
    id: shortDescription
    attributes:
      label: Description
      description: >-
        Two or three sentences on the problem it solves. Prose, not bullets.
        Required for a new project.

  - type: textarea
    id: featureHighlights
    attributes:
      label: Highlights
      description: >-
        One per line, four to six of them. Concrete beats adjectival. Required
        for a new project. Filling this in replaces the whole list, so repeat
        the lines you want to keep.
      placeholder: |
        Orchestrator routing to four sub-agents
        Circuit breaker trips instead of burning quota
        Guardrail validator on every tool call

  - type: input
    id: techStackTags
    attributes:
      label: Tech stack
      description: >-
        Comma-separated. Required for a new project. Replaces the whole list.
      placeholder: Python, FastAPI, Postgres

  - type: input
    id: statValue
    attributes:
      label: Pull-stat figure
      description: Optional. The big number on the open panel, e.g. 424.
      placeholder: '424'

  - type: input
    id: statLabel
    attributes:
      label: Pull-stat label
      description: Optional. What the figure counts, e.g. automated tests.
      placeholder: automated tests

  - type: input
    id: githubUrl
    attributes:
      label: GitHub URL
      description: Leave blank if the source cannot be published.

  - type: input
    id: liveDemoUrl
    attributes:
      label: Live demo URL
      description: Optional.

  - type: input
    id: availabilityNote
    attributes:
      label: Availability note
      description: >-
        Shown in place of the links when there is no public repo. Fill in either
        this or GitHub URL — not both.
      placeholder: Client work — source not public.
